camel.main.name = ai-email-classification-reply-workflow
camel.jbang.dependencies = org.xerial:sqlite-jdbc:3.49.1.0,org.jsoup:jsoup:1.21.2

# API keys can be exported or set in the gitignored .env file loaded by run.sh.
typesafe.api.key = {{env:TYPESAFE_API_KEY:}}
typesafe.url = {{env:TYPESAFE_URL:https://api.typesafe.ai/v1/systemone}}
typesafe.model = {{env:TYPESAFE_MODEL:jev-latest}}
typesafe.questions.file = config/jev-questions.json
openai.api.key = {{env:OPENAI_API_KEY:}}
# A complete OPENAI_URL takes precedence; otherwise append /chat/completions to the base URL.
openai.base.url = {{env:OPENAI_BASE_URL:https://api.openai.com/v1}}
openai.url = {{env:OPENAI_URL:}}
openai.model = {{env:OPENAI_MODEL:gpt-4.1-mini}}
openai.max.completion.tokens = 1200
openai.prompt.file = config/reply-prompt.txt
http.timeout.ms = 60000

email.files.enabled = {{env:EMAIL_FILES_ENABLED:true}}
email.inbox.dir = {{env:EMAIL_INBOX_DIR:data/inbox}}
email.max.body.chars = 50000
db.file = {{env:EMAIL_DB_FILE:data/emails.db}}
db.busy.timeout.ms = 10000

# Optional IMAPS input. Enable after configuring the mailbox credentials.
email.imap.enabled = {{env:EMAIL_IMAP_ENABLED:false}}
email.imap.host = {{env:EMAIL_IMAP_HOST:localhost}}
email.imap.port = {{env:EMAIL_IMAP_PORT:993}}
email.imap.username = {{env:EMAIL_IMAP_USERNAME:}}
email.imap.password = {{env:EMAIL_IMAP_PASSWORD:}}
email.imap.folder = {{env:EMAIL_IMAP_FOLDER:INBOX}}
email.imap.delay.ms = 30000
